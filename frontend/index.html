    <style>
        /* --- RESET & ROOT --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            /* Gradients */
            --grad-start: #ff4500; 
            --grad-end: #ff8c00;   
            --gradient-main: linear-gradient(135deg, #ff4500 0%, #ff8c00 100%);

            --text-muted: #9ca3af;
            --text-light: #ffffff;

        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-app);

            color: var(--text-main);

        }

        /* --- SIDEBAR --- */

            border-right: 1px solid var(--border-subtle);
            padding: 24px 16px; display: flex; flex-direction: column; flex-shrink: 0;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: 700; margin-bottom: 32px; color: var(--text-light); }
        .brand-icon { width: 36px; height: 36px; background: var(--gradient-main); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4); }

        .nav-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-light); }
        .nav-item.active { background: rgba(255, 69, 0, 0.12); color: #ff8c00; }

        .new-chat-btn { background: var(--gradient-main); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; transition: 0.2s; box-shadow: 0 4px 20px rgba(255, 69, 0, 0.3); }

        .history-trigger:hover { border-color: rgba(255,255,255,0.15); color: var(--text-light); background: rgba(255,255,255,0.06); }

    // --------------------------------------------------
    // Basic Markdown Formatting
    // --------------------------------------------------

    function formatAnswer(text) {

        let html = escapeHtml(text);

        // Code blocks
        html = html.replace(
            /```([\s\S]*?)```/g,
            '<pre style="background:#0d0d10;padding:16px;border-radius:10px;overflow-x:auto;margin:15px 0;"><code>$1</code></pre>'
        );

        // Inline code
        html = html.replace(
            /`([^`]+)`/g,
            '<code>$1</code>'
        );

        // Bold
        html = html.replace(
            /\*\*(.*?)\*\*/g,
            '<strong>$1</strong>'
        );

        // Line breaks
        html = html.replace(/\n/g, '<br>');

        return html;
    }


    // --------------------------------------------------
    // Extract GitHub URL
    // --------------------------------------------------

    function extractRepoUrl(text) {

        const match = text.match(
            /https:\/\/github\.com\/[^\s/]+\/[^\s/]+/
        );

        return match ? match[0].replace(/[.,)]$/, '') : null;
    }


    // --------------------------------------------------
    // Parse one raw SSE event block into { eventType, data }
    //
    // A single SSE message looks like:
    //   event: status
    //   data: {"message": "..."}
    //
    // Messages are separated from each other by a BLANK LINE,
    // not just "\n". The previous version of this code checked
    // `line.startsWith('status ')` / `line.startsWith('answer ')`,
    // which never matched the real "event: status" / "event: answer"
    // lines the backend actually sends — so finalAnswer was always
    // empty. This parses the spec correctly.
    // --------------------------------------------------

    function parseSSEEvent(rawBlock) {

        let eventType = null;
        let dataStr = null;

        const lines = rawBlock.split('\n');

        for (const line of lines) {

            if (line.startsWith('event:')) {
                eventType = line.slice(6).trim();
            } else if (line.startsWith('data:')) {
                dataStr = line.slice(5).trim();
            }
        }

        if (!eventType || dataStr === null) {
            return null;
        }

        try {
            return {
                eventType,
                data: JSON.parse(dataStr)
            };
        } catch (e) {
            console.warn('Could not parse SSE data JSON:', dataStr);
            return null;
        }
    }

        </div>
    `;

    // Attach event listeners to the new buttons
    const chips = aDiv.querySelectorAll('.assessment-chip');
    chips.forEach(chip => {
        chip.addEventListener('click', () => {
            // Remove the menu from the UI once a selection is made
            aDiv.remove(); 
            
            const type = chip.getAttribute('data-type');
            const selectedAudit = AUDIT_PROMPTS[type];
            
            // Trigger the backend workflow
            sendMessage(selectedAudit.api, selectedAudit.display);
        });
    });

    container.appendChild(aDiv);
    scrollToBottom();
}

// --------------------------------------------------
// Send Message (Fixed to handle URL-only and auto-attach repo)
// --------------------------------------------------

async function sendMessage(hiddenApiPrompt = null, customDisplayMsg = null) {

    if (isLoading) return;

    const rawInputText = input.value.trim();
    const text = hiddenApiPrompt !== null ? hiddenApiPrompt : rawInputText;

    if (!text) return;

    // ----------------------------------------------
    // 1. Detect or update repoUrl
    // ----------------------------------------------
    const detectedUrl = extractRepoUrl(text);
    if (detectedUrl) {
        repoUrl = detectedUrl;
    }

    // ----------------------------------------------
    // 2. Handle URL-only submission (No question provided)
    // ----------------------------------------------
    // If the user typed *only* a GitHub URL, don't hit the agent pipeline yet. 
    // Just acknowledge it locally so the UI feels responsive.
    if (hiddenApiPrompt === null && repoUrl && text === repoUrl) {
        addUserMessage(text);
        input.value = '';
        addAIMessage(`Repository successfully loaded and indexed: ${repoUrl}\n\nYou can now ask questions about it or run a Deep Audit from the sidebar!`);
        return;
    }

    // If they tried to run an audit or ask a question without ever giving a URL first
    if (!repoUrl) {
        addAIMessage('Please start by pasting a GitHub repository URL.');
        return;
    }

    // ----------------------------------------------
    // 3. Build API message (Always ensure repoUrl + prompt are sent)
    // ----------------------------------------------
    let apiMessage;
    if (text.includes(repoUrl)) {
        apiMessage = text;
    } else {
        // Automatically prepend the stored repoUrl to any button/menu action!
        apiMessage = `${repoUrl} ${text}`;
    }

    // ----------------------------------------------
    // 4. Display user message
    // ----------------------------------------------
    const textToShow = customDisplayMsg !== null ? customDisplayMsg : rawInputText;
    addUserMessage(textToShow);

    if (hiddenApiPrompt === null) {
        input.value = '';
    }

    isLoading = true;
    sendBtn.disabled = true;

    addLoadingMessage();

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'text/event-stream'
            },
            body: JSON.stringify({
                message: apiMessage
            })
        });

        if (!response.ok) {
            let errorText = await response.text();
            removeLoadingMessage();
            addAIMessage(`Error: ${errorText || 'Something went wrong while processing your request.'}`);
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = '';
        let finalAnswer = '';
        let sawError = false;

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const blocks = buffer.split('\n\n');
            buffer = blocks.pop();

            for (const rawBlock of blocks) {
                if (!rawBlock.trim()) continue;
                const parsed = parseSSEEvent(rawBlock);
                if (!parsed) continue;

                if (parsed.eventType === 'status') {
                    updateLoadingStatus(parsed.data.message || 'Working...');
                } else if (parsed.eventType === 'answer') {
                    finalAnswer = parsed.data.answer || '';
                } else if (parsed.eventType === 'error') {
                    sawError = true;
                    removeLoadingMessage();
                    addAIMessage(`Error: ${parsed.data.message || 'Something went wrong.'}`);
                }
            }
            if (sawError) break;
        }

        if (sawError) return;

        removeLoadingMessage();

        if (finalAnswer) {
            addAIMessage(finalAnswer);
        } else {
            addAIMessage('The agent completed the request but returned no answer.');
        }

    } catch (error) {
        removeLoadingMessage();
        console.error('API Error:', error);
        addAIMessage('Unable to connect to the RepoAI backend.');
    } finally {
        isLoading = false;
        sendBtn.disabled = false;
        input.focus();
    }
}

    // --------------------------------------------------
    // Copy Answer
    // --------------------------------------------------

    function copyAnswer(button) {

        const card = button.closest('.ai-analysis-card');
        const body = card.querySelector('.ai-explanation');

        navigator.clipboard.writeText(body.innerText);

        const original = button.innerHTML;

        button.innerHTML =
            '<i class="fa-solid fa-check"></i> Copied';

        setTimeout(() => {
            button.innerHTML = original;
        }, 1500);
    }

    // --------------------------------------------------
// Download Report as .md file
// --------------------------------------------------

function downloadReport(button) {
    const card = button.closest('.ai-analysis-card');
    const body = card.querySelector('.ai-explanation');

    // Extract the raw inner text of the report
    const reportText = body.innerText;

    // Create a Blob containing the text data
    const blob = new Blob([reportText], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    // Create a temporary hidden anchor element to trigger the download
    const a = document.createElement('a');
    a.href = url;
    a.download = `RepoAI_Assessment_Report_${new Date().toISOString().slice(0, 10)}.md`;
    
    document.body.appendChild(a);
    a.click();

    // Clean up the object URL and remove the element
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // Visual feedback on the button
    const original = button.innerHTML;
    button.innerHTML = '<i class="fa-solid fa-check"></i> Downloaded';
    setTimeout(() => {
        button.innerHTML = original;
    }, 1500);
}


    // --------------------------------------------------
    // Scroll
    // --------------------------------------------------

    function scrollToBottom() {
        container.scrollTop = container.scrollHeight;
    }


    // --------------------------------------------------
    // Events
    // --------------------------------------------------

    sendBtn.addEventListener('click', (e) => {
        e.preventDefault();
        sendMessage();
    });

    input.addEventListener('keypress', (e) => {

        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }

    });


    // --------------------------------------------------
    // New Chat
    // --------------------------------------------------

    newChatBtn.addEventListener('click', (e) => {

        e.preventDefault();

        repoUrl = null;

        container.innerHTML = '';

        input.value = '';

        input.placeholder =
            'Paste GitHub URL + ask your first question...';

        input.focus();
    });
    </script>
